name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev
          pip install buildozer cython==0.29.36 virtualenv
      - name: Create buildozer.spec
        run: |
          cat > buildozer.spec << 'EOF'
          [app]
          title = Plants vs Zombies
          package.name = pvzultimate
          package.domain = org.pvz
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas,ttf,ogg,wav,json
          version = 10.0
          requirements = python3,kivy,pygame-ce
          orientation = landscape
          fullscreen = 1
          android.api = 31
          android.minapi = 21
          android.archs = arm64-v8a, armeabi-v7a
          p4a.branch = master
          android.accept_sdk_license = True
          EOF
      - name: Build APK
        run: yes | buildozer android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PvZ-APK
          path: bin/*.apk
